name: Build Suite

on:
  workflow_dispatch:
    inputs:
      Auth:
        description: 'Build Auth'
        type: boolean
        default: true
      Calendar:
        description: 'Build Calendar'
        type: boolean
        default: true
      Drive:
        description: 'Build Drive'
        type: boolean
        default: true
      Mail:
        description: 'Build Mail'
        type: boolean
        default: true
      Pass:
        description: 'Build Pass'
        type: boolean
        default: true
      VPN:
        description: 'Build VPN'
        type: boolean
        default: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          AUTH: ${{ inputs.Auth }}
          CALENDAR: ${{ inputs.Calendar }}
          DRIVE: ${{ inputs.Drive }}
          MAIL: ${{ inputs.Mail }}
          PASS: ${{ inputs.Pass }}
          VPN: ${{ inputs.VPN }}
        run: |
          JSON=$(jq -n -c '{include: [
            (if env.AUTH == "true" then {app: "Auth", task: "assembleFdroidProdRelease"} else empty end),
            (if env.CALENDAR == "true" then {app: "Calendar", task: "assembleProdRelease"} else empty end),
            (if env.DRIVE == "true" then {app: "Drive", task: "assembleProdRelease"} else empty end),
            (if env.MAIL == "true" then {app: "Mail", task: "assembleFdroidProdRelease"} else empty end),
            (if env.PASS == "true" then {app: "Pass", task: "assembleFdroidProdRelease"} else empty end),
            (if env.VPN == "true" then {app: "VPN", task: "assembleProductionVanillaOpenSourceRelease"} else empty end)
          ]}')
          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  build:
    needs: prepare-matrix
    if: ${{ fromJson(needs.prepare-matrix.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    
    runs-on: ubuntu-latest
    name: Build ${{ matrix.app }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # PATCH İŞLEMİ EKLENDİ
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Apply Custom Names and Packages
        run: node patch.js

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > apps/${{ matrix.app }}/app/release.jks

      - name: Build Optimized APK
        working-directory: apps/${{ matrix.app }}
        run: |
          ./gradlew ${{ matrix.task }} \
            -Pandroid.injected.abi=arm64-v8a \
            -Pandroid.enableR8.fullMode=true \
            --no-daemon --parallel
        env:
          MYAPP_RELEASE_STORE_FILE: release.jks
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-foss-arm64
          path: apps/${{ matrix.app }}/**/release/*.apk