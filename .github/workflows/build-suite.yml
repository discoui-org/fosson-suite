name: Build Suite

on:
  workflow_dispatch:
    inputs:
      Auth:
        description: 'Build Auth'
        type: boolean
        default: true
      Calendar:
        description: 'Build Calendar'
        type: boolean
        default: true
      Drive:
        description: 'Build Drive'
        type: boolean
        default: true
      Mail:
        description: 'Build Mail'
        type: boolean
        default: true
      Pass:
        description: 'Build Pass'
        type: boolean
        default: true
      VPN:
        description: 'Build VPN'
        type: boolean
        default: true
      push_to_fdroid:
        description: 'Push to F-Droid'
        type: boolean
        default: true
      push_to_releases:
        description: 'Push to GitHub Releases'
        type: boolean
        default: true
      push_to_workflow_artifacts:
        description: 'Push to Workflow Artifacts'
        type: boolean
        default: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          AUTH: ${{ inputs.Auth }}
          CALENDAR: ${{ inputs.Calendar }}
          DRIVE: ${{ inputs.Drive }}
          MAIL: ${{ inputs.Mail }}
          PASS: ${{ inputs.Pass }}
          VPN: ${{ inputs.VPN }}
        run: |
          JSON=$(jq -n -c '{include: [
            (if env.AUTH == "true" then {app: "Auth", task: "assembleFdroidProdRelease"} else empty end),
            (if env.CALENDAR == "true" then {app: "Calendar", task: "assembleProdRelease"} else empty end),
            (if env.DRIVE == "true" then {app: "Drive", task: "assembleProdRelease"} else empty end),
            (if env.MAIL == "true" then {app: "Mail", task: "assembleFdroidProdRelease"} else empty end),
            (if env.PASS == "true" then {app: "Pass", task: "assembleFdroidProdRelease"} else empty end),
            (if env.VPN == "true" then {app: "VPN", task: "assembleProductionVanillaOpenSourceRelease"} else empty end)
          ]}')
          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  build:
    needs: prepare-matrix
    if: ${{ fromJson(needs.prepare-matrix.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    
    runs-on: ubuntu-latest
    name: Build ${{ matrix.app }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install

      - name: Setup Core Libraries
        run: npm run setup-libs

      - name: Apply Custom Patches and Generate Icons
        run: npm run patch -- --app ${{ matrix.app }}
        env:
          PATCH_LEVEL: ${{ github.run_number }}

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > apps/${{ matrix.app }}/app/release.jks

      - name: Build Optimized APK
        working-directory: apps/${{ matrix.app }}
        run: |
          # Dynamic Versioning via Gradle Properties
          ./gradlew ${{ matrix.task }} \
            -Pandroid.injected.abi=arm64-v8a \
            -Pandroid.enableR8.fullMode=true \
            -PpatchLevel=${{ github.run_number }} \
            --no-daemon --parallel
        env:
          CI_SERVER_HOST: gitlab.com
          CI_PROJECT_PATH: proton/mobile/android/proton-libs
          MYAPP_RELEASE_STORE_FILE: release.jks
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Artifacts (Rename APK & Zip Source)
        run: |
          APK_PATH=$(find apps/${{ matrix.app }} -name "*.apk" | head -n 1)
          NEW_APK_NAME="${{ matrix.app }}-fosson.${{ github.run_number }}.apk"
          cp "$APK_PATH" "$NEW_APK_NAME"
          zip -r "patched-source-${{ matrix.app }}.zip" "apps/${{ matrix.app }}" -x "**/build/*" "**/.gradle/*" "**/.git/*"

      - name: Upload APK and Source
        if: ${{ inputs.push_to_workflow_artifacts || inputs.push_to_releases || inputs.push_to_fdroid }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.app }}
          path: |
            *.apk
            *.zip

  deploy-release:
    needs: build
    if: ${{ inputs.push_to_releases }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r${{ github.run_number }}
          name: "Fosson Suite Release #${{ github.run_number }}"
          body: |
            ## Fosson Suite Build
            Bu sürüm otomatik olarak yamalanmış ve derlenmiştir.
            - Build Number: ${{ github.run_number }}
            - Apps Included: Auth, Pass, VPN, Drive, Mail, Calendar
          files: |
            release-artifacts/*.apk
            release-artifacts/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-fdroid:
    needs: deploy-release
    if: ${{ always() && (inputs.push_to_fdroid) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: all-apks
          merge-multiple: true
        continue-on-error: true

      - name: Fetch latest APKs from Releases (if no build was run)
        shell: bash
        run: |
          if [ ! -d "all-apks" ] || [ -z "$(ls -A all-apks/*.apk 2>/dev/null)" ]; then
            echo "[!] No artifacts found from this run. Fetching latest APKs from GitHub Releases..."
            mkdir -p all-apks
            # Download all APKs from the latest release
            gh release download --pattern "*.apk" --dir all-apks
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install F-Droid Server
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools libjpeg-dev zlib1g-dev
          pip3 install --user fdroidserver
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup F-Droid Repo
        run: |
          # 1. Klasör yapısını hazırla
          mkdir -p deploy/fdroid/repo
          cp all-apks/*.apk deploy/fdroid/repo/
          
          # 2. F-Droid konfigürasyonunu hazırla
          mkdir -p fdroid-tool
          cd fdroid-tool
          if [ ! -f "config.yml" ]; then
            fdroid init --no-prompt
            # init ile oluşan boş repo klasörünü sil ki linkleme yapabilelim
            rm -rf repo
          fi
          
          # URL ve metadata güncellemelerini HER ZAMAN yapalım (if dışında)
          # 'repo_url:' ile başlayan her şeyi yakala
          sed -i 's|repo_url:.*|repo_url: https://discoui-org.github.io/fosson-suite/fdroid/repo|g' config.yml
          sed -i 's|repo_name:.*|repo_name: Fosson Suite Repository|g' config.yml
          
          # Kontrol için config dosyasını loglara yazalım (gizli bilgi içermez)
          echo "--- DEBUG: config.yml content ---"
          grep "repo_url" config.yml
          echo "---------------------------------"
          
          # 3. APK'ları araca göster ve update et (artık linkleme başarılı olacak)
          ln -sf ../deploy/fdroid/repo repo
          fdroid update --create-metadata --verbose
          
          # 4. QR kodu ana dizine kopyala
          cp repo/index.png ../deploy/index.png
          
          # 5. Landing Page'i ANA DİZİN (root) için oluştur
          cat <<EOF > ../deploy/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Fosson Suite - F-Droid Repository</title>
              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
              <style>
                  :root {
                      --md-sys-color-primary: rgb(26, 35, 126);
                      --md-sys-color-on-primary: #FFFFFF;
                      --md-sys-color-primary-container: rgb(221, 225, 255);
                      --md-sys-color-on-primary-container: #001466;
                      --md-sys-color-surface: #FDFBFF;
                      --md-sys-color-surface-variant: #E2E2EC;
                      --md-sys-color-on-surface: #1B1B1F;
                      --md-sys-color-outline: #767680;
                  }
                  body {
                      font-family: 'Outfit', sans-serif;
                      background-color: var(--md-sys-color-surface);
                      color: var(--md-sys-color-on-surface);
                      margin: 0;
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      min-height: 100vh;
                      padding: 24px;
                  }
                  .container { max-width: 600px; width: 100%; text-align: center; }
                  .header { margin-top: 48px; margin-bottom: 32px; }
                  .logo-container img { width: 96px; height: 96px; border-radius: 24px; }
                  h1 { font-weight: 500; font-size: 2.5rem; margin: 0; }
                  .subtitle { color: var(--md-sys-color-outline); font-size: 1.1rem; margin-top: 8px; }
                  .card {
                      background-color: var(--md-sys-color-primary-container);
                      color: var(--md-sys-color-on-primary-container);
                      border-radius: 28px;
                      padding: 32px;
                      margin-top: 24px;
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                  }
                  .qr-outer { background: white; padding: 16px; border-radius: 20px; margin-bottom: 24px; }
                  .qr-outer img { display: block; width: 180px; height: 180px; }
                  .url-chip {
                      background-color: var(--md-sys-color-surface);
                      color: var(--md-sys-color-primary);
                      padding: 12px 24px; border-radius: 100px;
                      font-family: monospace; font-size: 0.85rem;
                      margin: 16px 0; border: 1px solid var(--md-sys-color-outline);
                      cursor: pointer;
                  }
                  .instruction-list { text-align: left; width: 100%; margin-top: 24px; background: rgba(255,255,255,0.4); border-radius: 20px; padding: 20px; }
                  .step { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
                  .step-icon {
                      background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
                      width: 28px; height: 28px; border-radius: 14px;
                      display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.8rem;
                  }
                  footer { margin-top: auto; padding: 48px 0; color: var(--md-sys-color-outline); font-size: 0.85rem; font-style: italic; }
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <div class="logo-container">
                          <img src="https://raw.githubusercontent.com/discoui-org/fosson-suite/main/assets/icon.svg" alt="Fosson Logo">
                      </div>
                      <h1>Fosson Suite</h1>
                      <p class="subtitle">Premium Privacy Experience</p>
                  </div>
                  <div class="card">
                      <div class="qr-outer">
                          <img src="index.png" alt="QR Code">
                      </div>
                      <p style="margin: 0; font-weight: 500;">Add to F-Droid</p>
                      <div class="url-chip" onclick="navigator.clipboard.writeText(this.innerText); alert('URL Copied!')">
                          https://discoui-org.github.io/fosson-suite/fdroid/repo
                      </div>
                      <div class="instruction-list">
                          <div class="step"><div class="step-icon">1</div> Open F-Droid on your device</div>
                          <div class="step"><div class="step-icon">2</div> Settings &gt; Repositories</div>
                          <div class="step"><div class="step-icon">3</div> Tap + and paste the URL</div>
                          <div class="step"><div class="step-icon">4</div> Refresh and enjoy Fosson</div>
                      </div>
                  </div>
              </div>
              <footer>"The internet is a scary place. ily Proton." — Hoax Cherry</footer>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true