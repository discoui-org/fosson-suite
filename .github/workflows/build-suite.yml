name: Build Suite

on:
  workflow_dispatch:
    inputs:
      Auth:
        description: 'Build Auth'
        type: boolean
        default: true
      Calendar:
        description: 'Build Calendar'
        type: boolean
        default: true
      Drive:
        description: 'Build Drive'
        type: boolean
        default: true
      Mail:
        description: 'Build Mail'
        type: boolean
        default: true
      Pass:
        description: 'Build Pass'
        type: boolean
        default: true
      VPN:
        description: 'Build VPN'
        type: boolean
        default: true
      push_to_fdroid:
        description: 'Push to F-Droid'
        type: boolean
        default: true
      push_to_releases:
        description: 'Push to GitHub Releases'
        type: boolean
        default: true
      push_to_workflow_artifacts:
        description: 'Push to Workflow Artifacts'
        type: boolean
        default: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          AUTH: ${{ inputs.Auth }}
          CALENDAR: ${{ inputs.Calendar }}
          DRIVE: ${{ inputs.Drive }}
          MAIL: ${{ inputs.Mail }}
          PASS: ${{ inputs.Pass }}
          VPN: ${{ inputs.VPN }}
        run: |
          JSON=$(jq -n -c '{include: [
            (if env.AUTH == "true" then {app: "Auth", task: "assembleFdroidProdRelease"} else empty end),
            (if env.CALENDAR == "true" then {app: "Calendar", task: "assembleProdRelease"} else empty end),
            (if env.DRIVE == "true" then {app: "Drive", task: "assembleProdRelease"} else empty end),
            (if env.MAIL == "true" then {app: "Mail", task: "assembleFdroidProdRelease"} else empty end),
            (if env.PASS == "true" then {app: "Pass", task: "assembleFdroidProdRelease"} else empty end),
            (if env.VPN == "true" then {app: "VPN", task: "assembleProductionVanillaOpenSourceRelease"} else empty end)
          ]}')
          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  build:
    needs: prepare-matrix
    if: ${{ fromJson(needs.prepare-matrix.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    
    runs-on: ubuntu-latest
    name: Build ${{ matrix.app }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install

      - name: Apply Custom Patches and Generate Icons
        run: npm run patch -- --app ${{ matrix.app }}
        env:
          PATCH_LEVEL: ${{ github.run_number }}

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > apps/${{ matrix.app }}/app/release.jks

      - name: Build Optimized APK
        working-directory: apps/${{ matrix.app }}
        run: |
          # Dynamic Versioning via Gradle Properties
          ./gradlew ${{ matrix.task }} \
            -Pandroid.injected.abi=arm64-v8a \
            -Pandroid.enableR8.fullMode=true \
            -PpatchLevel=${{ github.run_number }} \
            --no-daemon --parallel
        env:
          CI_SERVER_HOST: gitlab.com
          CI_PROJECT_PATH: proton/mobile/android/proton-libs
          MYAPP_RELEASE_STORE_FILE: release.jks
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Artifacts (Rename APK & Zip Source)
        run: |
          APK_PATH=$(find apps/${{ matrix.app }} -name "*.apk" | head -n 1)
          NEW_APK_NAME="${{ matrix.app }}-fosson.${{ github.run_number }}.apk"
          cp "$APK_PATH" "$NEW_APK_NAME"
          zip -r "patched-source-${{ matrix.app }}.zip" "apps/${{ matrix.app }}" -x "**/build/*" "**/.gradle/*" "**/.git/*"

      - name: Upload APK and Source
        if: ${{ inputs.push_to_workflow_artifacts || inputs.push_to_releases || inputs.push_to_fdroid }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.app }}
          path: |
            *.apk
            *.zip

  deploy-release:
    needs: build
    if: ${{ inputs.push_to_releases }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r${{ github.run_number }}
          name: "Fosson Suite Release #${{ github.run_number }}"
          body: |
            ## Fosson Suite Build
            Bu sürüm otomatik olarak yamalanmış ve derlenmiştir.
            - Build Number: ${{ github.run_number }}
            - Apps Included: Auth, Pass, VPN, Drive, Mail, Calendar
          files: |
            release-artifacts/*.apk
            release-artifacts/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-fdroid:
    needs: deploy-release
    if: ${{ always() && (inputs.push_to_fdroid) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: all-apks
          merge-multiple: true
        continue-on-error: true

      - name: Fetch latest APKs from Releases (if no build was run)
        shell: bash
        run: |
          if [ ! -d "all-apks" ] || [ -z "$(ls -A all-apks/*.apk 2>/dev/null)" ]; then
            echo "[!] No artifacts found from this run. Fetching latest APKs from GitHub Releases..."
            mkdir -p all-apks
            # Download all APKs from the latest release
            gh release download --pattern "*.apk" --dir all-apks
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install F-Droid Server
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools libjpeg-dev zlib1g-dev
          pip3 install --user fdroidserver
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup F-Droid Repo
        run: |
          mkdir -p fdroid/repo
          cp all-apks/*.apk fdroid/repo/
          cd fdroid
          # Initialize config if not exists
          if [ ! -f "config.yml" ]; then
            fdroid init --no-prompt
          fi
          # Create metadata and update the index
          fdroid update --create-metadata --verbose

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          publish_branch: gh-pages
          force_orphan: true